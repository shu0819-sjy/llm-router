name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# No concurrency.cancel-in-progress — past "cancelled" conclusions were NOT
# caused by overlapping runs. Python 3.12 unit tests hung until the GitHub
# Actions default 6h job timeout while 3.11 + Docker stayed green. Job/step
# timeouts below fail fast instead of looking like a manual cancel.

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Type check (hard gate)
        run: mypy app

      - name: Unit tests with coverage gate
        # Dual cap: GHA step timeout + GNU coreutils timeout on ubuntu runners.
        timeout-minutes: 12
        run: timeout 600 python -m pytest -q --cov=app --cov-report=term-missing
        env:
          # Never enable live upstream tests in default CI
          LLM_ROUTER_RUN_INTEGRATION: "0"

      - name: Integration lane stays double-gated
        # Selecting the marker explicitly must still skip every live case
        # while the opt-in flag is unset.
        run: python -m pytest -m integration -q
        env:
          LLM_ROUTER_RUN_INTEGRATION: "0"

  docker:
    name: Docker build, health and restart/migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build image
        run: docker build -t llm-router:ci .

      - name: Restart and migration smoke (clean temporary volume)
        # Boots the image on a v0.2.0-schema database (additive migration +
        # row survival), then verifies panel keys and usage history survive
        # `docker restart`. Packaged-defaults smoke, not a production claim.
        run: python scripts/restart_migration_smoke.py --image llm-router:ci --port 18000

      - name: Run container and curl /health
        run: |
          set -euo pipefail
          TOKEN="ci-admin-$(openssl rand -hex 8)"
          docker run -d --name llm-router-ci \
            -p 8000:8000 \
            -e LLM_ROUTER_ENV=development \
            -e LLM_ROUTER_ADMIN_TOKEN="$TOKEN" \
            -e LLM_ROUTER_API_KEYS=demo:sk-demo-key \
            llm-router:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              docker rm -f llm-router-ci
              exit 0
            fi
            sleep 2
          done
          docker logs llm-router-ci || true
          docker rm -f llm-router-ci || true
          echo "health check failed" >&2
          exit 1
