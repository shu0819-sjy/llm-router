name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Type check (informational)
        # mypy is not a hard gate in v0.2.0; see CONTRIBUTING.md
        continue-on-error: true
        run: mypy app

      - name: Unit tests with coverage gate
        run: python -m pytest -q --cov=app --cov-report=term-missing
        env:
          # Never enable live upstream tests in default CI
          LLM_ROUTER_RUN_INTEGRATION: "0"

  docker:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t llm-router:ci .

      - name: Run container and curl /health
        run: |
          set -euo pipefail
          TOKEN="ci-admin-$(openssl rand -hex 8)"
          docker run -d --name llm-router-ci \
            -p 8000:8000 \
            -e LLM_ROUTER_ENV=development \
            -e LLM_ROUTER_ADMIN_TOKEN="$TOKEN" \
            -e LLM_ROUTER_API_KEYS=demo:sk-demo-key \
            llm-router:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              docker rm -f llm-router-ci
              exit 0
            fi
            sleep 2
          done
          docker logs llm-router-ci || true
          docker rm -f llm-router-ci || true
          echo "health check failed" >&2
          exit 1
