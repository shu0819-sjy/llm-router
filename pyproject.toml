[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.3.2"
description = "Asyncio FastAPI LLM gateway with OpenAI-compatible Chat Completions and Models APIs, multi-provider failover"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shu0819-sjy" }]
dependencies = [
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "anyio==4.12.1",
    "ruff==0.16.7",
    "mypy==1.20.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not integration\""
markers = [
    "integration: live/network provider tests (opt-in; requires LLM_ROUTER_RUN_INTEGRATION=1)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length; existing modules exceed 100 in places
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "UP042", # str Enum → StrEnum; deferred to avoid app churn
]

[tool.ruff.lint.per-file-ignores]
# Path bootstrap before app imports is intentional for runnable scripts.
"scripts/bench_failover.py" = ["E402"]
# Pre-existing unit suite style; integration tests stay clean.
"tests/test_*.py" = ["I001", "F401", "F811"]
"tests/conftest.py" = ["I001", "F401"]
"app/**" = ["I001", "UP017", "UP035"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
pretty = true
files = ["app"]
# v0.3: mypy is a hard CI gate (no continue-on-error) and untyped defs are
# checked. The residual disables below are a documented, itemized set with a
# known path to removal — clear them and delete the entry when fixed:
#   assignment  — app/metrics/prometheus.py (float/int latency counter)
#   arg-type    — app/routing/key_digest.py, app/db/database.py (int(x | None)
#                 narrowing on id/lastrowid)
#   return-value— app/db/database.py fetchall() Iterable vs list
# Enabling warn_unused_ignores additionally requires dropping three stale
# `# type: ignore[arg-type]` comments left over after the v0.3 fixes.
disable_error_code = ["assignment", "arg-type", "return-value"]
